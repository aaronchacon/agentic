name: Deploy Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build docs (static prerender)
        run: pnpm exec nx build docs
        env:
          # Served at https://aaronchacon.github.io/agentic/
          DOCS_BASE_HREF: /agentic/

      # Analog writes the prerendered static site to analog/public
      - name: SPA fallback for unknown routes
        run: cp dist/packages/docs/analog/public/index.html dist/packages/docs/analog/public/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/packages/docs/analog/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
