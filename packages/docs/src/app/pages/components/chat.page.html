<article class="doc">
  <div class="doc__head">
    <p class="doc__eyebrow">{{ t().eyebrow }}</p>
    <h1 class="doc__title">{{ t().title }}</h1>
    <p class="doc__lead">{{ t().lead }}</p>
    <app-doc-md [markdown]="md" />
  </div>

  <section class="doc__section">
    <h2>{{ t().basicTitle }}</h2>
    <p [innerHTML]="t().basicIntro"></p>
    <app-doc-demo [code]="code">
      <div style="height: 480px">
        <agt-chat
          [store]="store"
          emptyTitle="Ask the KYC agent"
          [suggestions]="suggestions"
        />
      </div>
    </app-doc-demo>
  </section>

  <section class="doc__section">
    <h2>{{ t().apiTitle }}</h2>
    <app-doc-props [rows]="props()" />
  </section>
</article>
