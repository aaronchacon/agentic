<article class="doc">
  <div class="doc__head">
    <p class="doc__eyebrow">{{ t().eyebrow }}</p>
    <h1 class="doc__title">{{ t().title }}</h1>
    <p class="doc__lead">{{ t().lead }}</p>
    <app-doc-md [markdown]="md" />
  </div>

  <section class="doc__section">
    <h2>{{ t().statesTitle }}</h2>
    <app-doc-demo [code]="code">
      <div
        style="
          display: flex;
          flex-direction: column;
          gap: 12px;
          max-width: 520px;
          margin: 0 auto;
          width: 100%;
        "
      >
        <agt-tool-call [toolCall]="running" [steps]="steps" />
        <agt-tool-call [toolCall]="success" />
        <agt-tool-call [toolCall]="errored" />
      </div>
    </app-doc-demo>
  </section>

  <section class="doc__section">
    <h2>{{ t().apiTitle }}</h2>
    <app-doc-props [rows]="props()" />
  </section>
</article>
