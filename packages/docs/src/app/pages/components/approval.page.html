<article class="doc">
  <div class="doc__head">
    <p class="doc__eyebrow">{{ t().eyebrow }}</p>
    <h1 class="doc__title">{{ t().title }}</h1>
    <p class="doc__lead">{{ t().lead }}</p>
    <app-doc-md [markdown]="md" />
  </div>

  <section class="doc__section">
    <h2>{{ t().gateTitle }}</h2>
    <p>{{ t().gateIntro }}</p>
    <app-doc-demo [code]="code">
      <div style="max-width: 520px; margin: 0 auto; width: 100%">
        <agt-approval
          title="Approval required"
          action="Auto-approve KYC case #4821 (low risk)."
          [detail]="detail"
          [editable]="true"
        />
      </div>
    </app-doc-demo>
  </section>

  <section class="doc__section">
    <h2>{{ t().apiTitle }}</h2>
    <app-doc-props [rows]="props()" />
    <app-doc-props [nameHeader]="t().eventsHeader" [rows]="events()" />
  </section>
</article>
