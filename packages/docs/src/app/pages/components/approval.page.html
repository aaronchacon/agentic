<article class="doc">
  <div class="doc__head">
    <p class="doc__eyebrow">Components</p>
    <h1 class="doc__title">Approval</h1>
    <p class="doc__lead">
      A human-in-the-loop gate: the agent pauses and asks a person to approve,
      edit or reject an action before proceeding — non-negotiable in regulated
      flows. Resolves to an approved or rejected state.
    </p>
    <app-doc-md [markdown]="md" />
  </div>

  <section class="doc__section">
    <h2>Gate</h2>
    <p>Click Approve or Reject to resolve — the card records the decision.</p>
    <app-doc-demo [code]="code">
      <div style="max-width: 520px; margin: 0 auto; width: 100%">
        <agt-approval
          title="Approval required"
          action="Auto-approve KYC case #4821 (low risk)."
          [detail]="detail"
          [editable]="true"
        />
      </div>
    </app-doc-demo>
  </section>

  <section class="doc__section">
    <h2>API</h2>
    <app-doc-props [rows]="props" />
    <app-doc-props nameHeader="Event" [rows]="events" />
  </section>
</article>
