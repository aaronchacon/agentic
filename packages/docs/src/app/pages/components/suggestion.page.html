<article class="doc">
  <div class="doc__head">
    <p class="doc__eyebrow">{{ t().eyebrow }}</p>
    <h1 class="doc__title">{{ t().title }}</h1>
    <p class="doc__lead" [innerHTML]="t().lead"></p>
    <app-doc-md [markdown]="md" />
  </div>

  <section class="doc__section">
    <h2>{{ t().provenanceTitle }}</h2>
    <p>{{ t().provenanceIntro }}</p>
    <app-doc-demo [code]="code">
      <div
        style="
          display: flex;
          flex-direction: column;
          gap: 18px;
          max-width: 420px;
          margin: 0 auto;
          width: 100%;
        "
      >
        <agt-suggestion
          label="Full name"
          [suggestion]="'Ada Lovelace'"
          [confidence]="0.98"
          placeholder="Enter full name"
        />
        <agt-suggestion
          label="Nationality (accepted)"
          [suggestion]="'United Kingdom'"
          [confidence]="0.95"
          value="United Kingdom"
          [accepted]="true"
        />
        <agt-suggestion
          label="Date of birth (edited)"
          [suggestion]="'1815-12-10'"
          [confidence]="0.9"
          value="1815-12-11"
          [accepted]="true"
        />
      </div>
    </app-doc-demo>
  </section>

  <section class="doc__section">
    <h2>{{ t().apiTitle }}</h2>
    <app-doc-props [rows]="props()" />
  </section>
</article>
