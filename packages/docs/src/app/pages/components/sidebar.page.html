<article class="doc">
  <div class="doc__head">
    <p class="doc__eyebrow">{{ t().eyebrow }}</p>
    <h1 class="doc__title">{{ t().title }}</h1>
    <p class="doc__lead" [innerHTML]="t().lead"></p>
    <app-doc-md [markdown]="md" />
  </div>

  <section class="doc__section">
    <h2>{{ t().panelTitle }}</h2>
    <p [innerHTML]="t().panelIntro"></p>
    <app-doc-demo [code]="code">
      <div class="sidebar-hint">{{ t().panelHint }}</div>
    </app-doc-demo>
  </section>

  <section class="doc__section">
    <h2>{{ t().apiTitle }}</h2>
    <app-doc-props [rows]="props()" />
  </section>
</article>

<agt-sidebar title="KYC Agent" [badge]="2">
  <agt-chat
    [store]="store"
    emptyTitle="Ask the KYC agent"
    [suggestions]="suggestions"
  />
</agt-sidebar>
