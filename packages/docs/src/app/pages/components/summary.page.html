<article class="doc">
  <div class="doc__head">
    <p class="doc__eyebrow">{{ t().eyebrow }}</p>
    <h1 class="doc__title">{{ t().title }}</h1>
    <p class="doc__lead">{{ t().lead }}</p>
    <app-doc-md [markdown]="md" />
  </div>

  <section class="doc__section">
    <h2>{{ t().loadedTitle }}</h2>
    <app-doc-demo [code]="code">
      <div style="max-width: 560px; margin: 0 auto; width: 100%">
        <agt-summary title="Case summary" [content]="summary" />
      </div>
    </app-doc-demo>
  </section>

  <section class="doc__section">
    <h2>{{ t().loadingTitle }}</h2>
    <app-doc-demo [code]="loadingCode">
      <div style="max-width: 560px; margin: 0 auto; width: 100%">
        <agt-summary title="Case summary" [loading]="true" />
      </div>
    </app-doc-demo>
  </section>

  <section class="doc__section">
    <h2>{{ t().apiTitle }}</h2>
    <app-doc-props [rows]="props()" />
    <app-doc-props [nameHeader]="t().eventHeader" [rows]="events()" />
  </section>
</article>
