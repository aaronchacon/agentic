<article class="doc">
  <div class="doc__head">
    <p class="doc__eyebrow">Components</p>
    <h1 class="doc__title">Summary</h1>
    <p class="doc__lead">
      A card for AI-generated summaries — clearly marked as AI content, with
      regenerate + copy actions and a skeleton while loading. Content renders as
      markdown and can stream in.
    </p>
    <app-doc-md [markdown]="md" />
  </div>

  <section class="doc__section">
    <h2>Loaded</h2>
    <app-doc-demo [code]="code">
      <div style="max-width: 560px; margin: 0 auto; width: 100%">
        <agt-summary title="Case summary" [content]="summary" />
      </div>
    </app-doc-demo>
  </section>

  <section class="doc__section">
    <h2>Loading</h2>
    <app-doc-demo [code]="loadingCode">
      <div style="max-width: 560px; margin: 0 auto; width: 100%">
        <agt-summary title="Case summary" [loading]="true" />
      </div>
    </app-doc-demo>
  </section>

  <section class="doc__section">
    <h2>API</h2>
    <app-doc-props [rows]="props" />
    <app-doc-props nameHeader="Event" [rows]="events" />
  </section>
</article>
