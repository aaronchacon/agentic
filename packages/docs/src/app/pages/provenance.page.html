<article class="doc">
  <div class="doc__head">
    <p class="doc__eyebrow">{{ t().eyebrow }}</p>
    <h1 class="doc__title">{{ t().title }}</h1>
    <p class="doc__lead">{{ t().lead }}</p>
  </div>

  <section class="doc__section">
    <h2>{{ t().accent.title }}</h2>
    <p [innerHTML]="t().accent.body"></p>
  </section>

  <section class="doc__section">
    <h2>{{ t().summary.title }}</h2>
    <p>{{ t().summary.body }}</p>
    <app-doc-demo [code]="summaryCode">
      <div style="max-width: 560px; margin: 0 auto; width: 100%">
        <agt-summary title="Case summary" [content]="summary" />
      </div>
    </app-doc-demo>
  </section>

  <section class="doc__section">
    <h2>{{ t().field.title }}</h2>
    <p>{{ t().field.body }}</p>
    <app-doc-demo [code]="suggestionCode">
      <div
        style="
          display: flex;
          flex-direction: column;
          gap: 18px;
          max-width: 420px;
          margin: 0 auto;
          width: 100%;
        "
      >
        <agt-suggestion
          label="Full name"
          [suggestion]="'Ada Lovelace'"
          [confidence]="0.98"
          placeholder="Enter full name"
        />
        <agt-suggestion
          label="Date of birth (edited by human)"
          [suggestion]="'1815-12-10'"
          [confidence]="0.9"
          value="1815-12-11"
          [accepted]="true"
        />
      </div>
    </app-doc-demo>
  </section>

  <section class="doc__section">
    <h2>{{ t().chat.title }}</h2>
    <p>{{ t().chat.body }}</p>
    <app-doc-demo [code]="chatCode">
      <div style="height: 380px">
        <agt-chat
          [store]="store"
          emptyTitle="Ask the KYC agent"
          [suggestions]="suggestions"
        />
      </div>
    </app-doc-demo>
  </section>

  <section class="doc__section">
    <h2>{{ t().why.title }}</h2>
    <p>{{ t().why.body }}</p>
  </section>
</article>
