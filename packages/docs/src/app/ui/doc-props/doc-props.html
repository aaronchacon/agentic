<div class="doc-props-wrap">
  <table class="doc-props">
    <thead>
      <tr>
        <th>{{ nameHeader() }}</th>
        <th>{{ t().props.type }}</th>
        <th>{{ t().props.default }}</th>
        <th>{{ t().props.description }}</th>
      </tr>
    </thead>
    <tbody>
      @for (row of rows(); track row.name) {
      <tr>
        <td>
          <code>{{ row.name }}</code>
        </td>
        <td>
          <span class="doc-props__type">{{ row.type }}</span>
        </td>
        <td>
          @if (row.default) {
          <code class="doc-props__default">{{ row.default }}</code>
          } @else if (row.required) {
          <span class="doc-props__req">{{ t().props.required }}</span>
          } @else {
          <span class="doc-props__default">—</span>
          }
        </td>
        <td>{{ row.description }}</td>
      </tr>
      }
    </tbody>
  </table>
</div>
