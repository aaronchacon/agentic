<div class="docs">
  <header class="docs__header">
    <a routerLink="/" class="docs__brand">
      <span class="docs__logo" aria-hidden="true"></span>
      <span class="docs__name">agentic</span>
      <span class="docs__badge">v0.1</span>
    </a>
    <div class="docs__toplinks">
      <a
        class="docs__toplink"
        href="/llms.txt"
        target="_blank"
        rel="noreferrer"
        title="Docs as plain text for LLMs (llmstxt.org)"
        >llms.txt</a
      >
      <a
        class="docs__toplink"
        href="https://github.com/aaronchacon"
        target="_blank"
        rel="noreferrer"
        >GitHub</a
      >
      <button
        type="button"
        class="docs__icon-btn"
        [attr.aria-label]="isDark() ? chrome().header.toLight : chrome().header.toDark"
        (click)="toggleDark()"
      >
        @if (isDark()) {
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle
            cx="12"
            cy="12"
            r="4"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          />
          <path
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"
          />
        </svg>
        } @else {
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
            d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"
          />
        </svg>
        }
      </button>
      <button
        type="button"
        class="docs__icon-btn docs__lang-btn"
        [attr.aria-label]="chrome().header.toggleLang"
        (click)="toggleLocale()"
      >
        {{ locale() === 'en' ? 'ES' : 'EN' }}
      </button>
      <button
        type="button"
        class="docs__menu-btn"
        [attr.aria-label]="chrome().header.toggleNav"
        (click)="navOpen.set(!navOpen())"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            d="M4 7h16M4 12h16M4 17h16"
          />
        </svg>
      </button>
    </div>
  </header>

  <div class="docs__body">
    @if (navOpen()) {
    <div
      class="docs__backdrop"
      aria-hidden="true"
      (click)="navOpen.set(false)"
    ></div>
    }
    <aside class="docs__sidebar" [class.is-open]="navOpen()">
      @for (section of sections(); track section.title) {
      <div class="docs__nav-section">
        <p class="docs__nav-title">{{ section.title }}</p>
        <ul class="docs__nav-list">
          @for (item of section.items; track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: item.path === '/' }"
              (click)="navOpen.set(false)"
            >
              {{ item.label }}
            </a>
          </li>
          }
        </ul>
      </div>
      }
    </aside>

    <main class="docs__main">
      <router-outlet />
    </main>
  </div>
</div>
